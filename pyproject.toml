[project]
name = "recovery-agent"
version = "0.1.0"
description = "AI Revenue Recovery Agent — Razorpay Buildathon Track 03"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langmem>=0.0.30",
    "pydantic>=2.0",
    "rich>=13.0",
    "razorpay>=2.0",
    "flask>=3.0",
    "flask-socketio>=5.0",
    "python-dotenv>=1.0",
    "filelock>=3.0",
    "networkx>=3.0",
    "arize-phoenix>=4.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "openinference-instrumentation-llama-index>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_agent"]

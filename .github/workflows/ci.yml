# CI: the unit suite plus the recorded-decision conformance gate.
#
# The gate scores the COMMITTED corpus (evals/corpus/decisions.jsonl) against
# the frozen baseline (evals/baseline.json) — no LLM, no payment stack, no
# quota. The corpus widens every time someone runs the integration rig and
# `make evals` syncs the new decisions in, so this check gets stricter as the
# project is exercised, for free.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit suite
        run: python -m pytest tests/ -q

      - name: Recorded-decision conformance gate
        run: python -m recovery_agent.evals.run --mode recorded --check

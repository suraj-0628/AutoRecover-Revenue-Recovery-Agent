# AutoRecover — one-command local run.
#
#   cp .env.example .env      # add Razorpay TEST keys + an LLM endpoint/key
#   docker compose up --build
#
# Then open  http://localhost:5002/pay  (checkout)  and  /merchant  (HUD).
services:
  autorecover:
    build: .
    image: autorecover:latest
    container_name: autorecover
    env_file: .env
    # Lets the container reach an LLM endpoint running on the host machine.
    # If your LLM runs on the host (e.g. a local proxy), set in .env:
    #   LLM_BASE_URL=http://host.docker.internal:<port>/v1
    # (A hosted LLM URL like OpenAI/Anthropic needs neither this nor a change.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5002:5002"   # checkout + merchant HUD  ← start here
      - "5001:5001"   # analytics dashboard
      - "5000:5000"   # Razorpay webhook listener
      - "6006:6006"   # Phoenix tracing
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5002/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 40s
